[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Append the IPFS metadata hash to deployed bytecode (solc's default; this was "none").
#
# Not cosmetic. Blockscout and Sourcify can only certify a FULL match when the deployed bytecode
# carries the metadata hash — that hash is what proves this exact source, compiled with these
# exact settings, produced these exact bytes. Stripped, the strongest available result is a
# partial match: the runtime code matches, but nothing pins the compiler input that made it.
#
# For a protocol whose entire premise is that a labour office or a court-appointed expert can
# read the contract and trust it without trusting IMGEUM, "verified" needs to mean the strongest
# thing the explorer can say. The cost is ~53 bytes of deployed code per contract.
bytecode_hash = "ipfs"
evm_version = "cancun"
fs_permissions = [{access = "read-write", path = "./deployments"}]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

# GIWA network endpoints.
# Source: https://docs.giwa.io/get-started/connect-to-giwa.md
[rpc_endpoints]
giwa_sepolia = "${GIWA_SEPOLIA_RPC_URL}"
giwa_sepolia_flashblocks = "${GIWA_SEPOLIA_FLASHBLOCKS_RPC_URL}"

# Contract verification via Blockscout.
# Source: https://docs.giwa.io/get-started/smart-contract/develop/foundry.md
[etherscan]
giwa_sepolia = {key = "${BLOCKSCOUT_API_KEY}", url = "https://sepolia-explorer.giwa.io/api", chain = 91342}

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
